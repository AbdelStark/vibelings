[package]
name = "vibelings"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
authors = ["Vibelings Contributors"]
description = "Rustlings for agentic programming - learn to build reliable agentic AI systems"
license = "MIT"
repository = "https://github.com/AbdelStark/vibelings"
homepage = "https://github.com/AbdelStark/vibelings"
documentation = "https://docs.rs/vibelings"
keywords = ["ai", "agents", "education", "mcp", "llm"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    "/.github/",
    "/docs/",
    "/benches/",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "1"
anyhow = "1"

# JSON Schema validation
jsonschema = "0.29"

# File watching for watch mode
notify = "7"
notify-debouncer-mini = "0.5"

# Terminal UI
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"

# Directory and path utilities
directories = "5"
walkdir = "2"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Random number generation (for retry jitter)
rand = "0.9"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for trace IDs
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex for pattern matching
regex = "1"

[dev-dependencies]
# Testing utilities
tempfile = "3"
assert_cmd = "2"
predicates = "3"
mockall = "0.13"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "grader_bench"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Allow common pedantic patterns (pedantic is too strict for this project)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
similar_names = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
unnested_or_patterns = "allow"
unnecessary_wraps = "allow"
single_match_else = "allow"
match_same_arms = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
items_after_statements = "allow"
match_wildcard_for_single_variants = "allow"
trivially_copy_pass_by_ref = "allow"
needless_raw_string_hashes = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"
if_not_else = "allow"
return_self_not_must_use = "allow"
option_if_let_else = "allow"
manual_let_else = "allow"

[[bin]]
name = "vibelings"
path = "src/main.rs"
